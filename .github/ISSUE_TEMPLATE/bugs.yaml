name: 我发现了 Bug
description: 点击此项使用杀虫剂
title: '[Bug?]: '
labels: [ "bug" ]
assignees: []
projects: []
# type: bug   # 组织级功能：个人仓库校验不通过，如需启用请取消注释

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您愿意花一些时间来填写这个内容！
        ## 以下是一些注意事项，能让提交更快被处理

        ### ❗ | 确定没有相同提议的 ISSUE 已被提出。
        ### ❔ | 提议时，如果文字无法说明清楚，不妨使用画图的方法辅助说明
        ### ⚠ | 如果涉及敏感信息，请自行打码

        ## 提问指引
        [《提问的智慧》](https://lug.ustc.edu.cn/wiki/doc/smart-questions/)

        ---
  - type: checkboxes
    id: terms
    attributes:
      label: |
        请确保您已阅读以上注意事项，并勾选下方的确认框。
      options:
        - label: "我已经仔细阅读上述注意事项，并能够尝试运用其中任一文档所述的提问技巧。"
          required: true
        - label: "我确定这不是因为操作失误而引起的问题。"
          required: true
        - label: "我确定这是一个有意义的提问，且目前似乎没有可能的解决方案。"
          required: true
        - label: "我确定在最新版本中仍未修复"
          required: true
        - label: "我愿意为此问题提交 Pull Request，或者提供一些排查思路（非必选）"
          required: false

  - type: markdown
    attributes:
      value: |
        接下来我们将引导您详细地描述您所遇到的问题

  - type: textarea
    id: config-type
    attributes:
      label: 您使用的插件版本是？
      description: 使用 dsh plugin --profile list 查看
    validations:
      required: true

  - type: textarea
    id: config-file
    attributes:
      label: 环境信息
      description: |
        请粘贴 DSH 版本、安装方式（`dsh plugin add dsh-my-go` / agent preset）、
        相关配置（模型/effort/DSV4P0813 开关）；涉及敏感信息请自行打码。
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: 您反馈的问题属于以下哪个功能？
      description: 如果您确实不知道属于什么，可以选择 “我不确定”
      options:
        - 编排工具（go_work / continue / need_help / forward）
        - 子智能体（某个工种行为异常）
        - 模型绑定 / 思考档位
        - 编排面板 / 自动跳转子会话
        - 设置页 / 配置
        - 我不确定
    validations:
      required: true

  - type: dropdown
    id: question-type
    attributes:
      label: 您反馈的问题属于以下哪个类别？
      description: 如果您确实不知道属于什么，可以选择 “我不确定”
      options:
        - 功能异常
        - 弹窗报错
        - 无法生效
        - 我不确定
    validations:
      required: true

  - type: dropdown
    id: part-type
    attributes:
      label: 问题出在哪个工种 / 模块？
      description: 可多选；如果您确实不知道属于什么，可以选择 “我不确定”
      multiple: true
      options:
        - Sisyphus（总调度）
        - Hermes（快速执行）
        - Explore（检索）
        - Librarian（文档）
        - Multimodal Looker（看图）
        - Hephaestus（写代码）
        - Prometheus（规划）
        - Oracle（调试/终验）
        - client UI（面板/设置页）
        - 我不确定
    validations:
      required: true

  # Input | Reproduce
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 重现步骤
      description: |
        我需要执行哪些操作才能让 bug 出现？
        简洁清晰的重现步骤能够帮助更迅速地定位问题所在。
    validations:
      required: true

  # Input | Expected result
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果是什么？
    validations:
      required: true

  # Input | Actual result
  - type: textarea
    id: actual
    attributes:
      label: 实际的结果是什么？
    validations:
      required: true


  # Optional | Extra description
  - type: textarea
    id: extra-desc
    attributes:
      label: 补充说明（可选）
