# dsh-my-go CI: typecheck + build + smoke test on every push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # No lockfile is committed (.gitignore), so --frozen-lockfile would
        # fail on a fresh clone; resolve floating versions instead.
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build client bundle
        run: bun run build:client

      - name: Smoke test
        run: bun run test
