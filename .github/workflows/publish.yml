# dsh-my-go publish: build the client bundle and publish to npm on version tags
# using Trusted Publishing (OIDC) — no long-lived npm token stored in secrets.
#
# Usage:
#   1. First publish manually once to claim the package name:
#        npm login && npm publish --access public
#   2. On npmjs.com, open the package → Access → Trusted Publishing →
#      add provider "GitHub Actions" for your fork repo (<owner>/dsh-my-go).
#   3. From then on, tag and push to publish automatically:
#        git tag v0.1.0 && git push origin v0.1.0
#
# The workflow uses GitHub's OIDC identity (id-token: write) to mint a short-lived
# npm token, and --provenance attaches a verifiable build provenance statement.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing / provenance

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        # No lockfile is committed (.gitignore), so --frozen-lockfile would
        # fail on a fresh clone; resolve floating versions instead.
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build client bundle
        run: bun run build:client

      - name: Smoke test
        run: bun run test

      - name: Publish to npm
        run: npm publish --provenance --access public
